# Reference copy of the live config at /etc/nginx/sites-available/neurotrade
# on the VDS. The TLS block below was generated by `certbot --nginx` — if
# re-provisioning a server from scratch, start from the HTTP-only version
# (just the `location /` block on port 80) and let certbot rewrite it; don't
# hand-copy the ssl_certificate paths, they're host-specific.
#
# Replace 108-165-32-96.nip.io with the real domain if one is ever added.

server {
    server_name 108-165-32-96.nip.io;

    location / {
        auth_basic "NeuroTrade dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd_neurotrade;

        proxy_pass http://127.0.0.1:47913;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/108-165-32-96.nip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/108-165-32-96.nip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = 108-165-32-96.nip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name 108-165-32-96.nip.io;
    return 404; # managed by Certbot
}
